<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MedLink — Изменение профиля</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="profile-page"><main class="profile-editor"><header><a class="brand" href="/"><span class="brand-mark">+</span>med<span>link</span></a><button class="logout-button" id="logout">Выйти</button></header><div class="editor-wrap"><a class="back-link" id="backLink" href="/">← Вернуться в кабинет</a><div class="editor-heading"><div><div class="crumb">ЛИЧНЫЙ КАБИНЕТ <span>/</span> НАСТРОЙКИ</div><h1>Изменение профиля</h1><p id="profileSubtitle">Обновите информацию, которая отображается в кабинете.</p></div><div class="editor-avatar" id="editorAvatar">АК</div></div><form class="profile-form" id="profileForm"><div class="form-section"><h2>Основная информация</h2><p>Эти данные видны вам и участникам ваших приемов.</p><label>Имя и фамилия<input id="name" name="name" required maxlength="120"></label><label>Email<input id="email" name="email" type="email" readonly></label></div><div class="form-section doctor-fields"><h2>Профессиональные данные</h2><p>Информация для пациентов и коллег.</p><label>Специальность<input id="specialty" name="specialty" required maxlength="80"></label><label>Телефон<input id="phone" name="phone" required maxlength="30"></label><div class="readonly-fields"><div><small>Лицензия</small><strong id="license">—</strong></div><div><small>Опыт работы</small><strong id="experience">—</strong></div></div></div><div class="form-actions"><span class="save-status" id="saveStatus"></span><a class="cancel-link" id="cancel" href="/">Отмена</a><button class="primary-button" id="save" type="submit">Сохранить изменения</button></div></form></div></main><script src="profile.js"></script></body></html>
