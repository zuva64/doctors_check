<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLink — Видеоприем</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="video-page">
  <main class="video-room">
    <header>
      <div class="brand"><span class="brand-mark">+</span>med<span>link</span></div>
      <div class="room-status"><span></span>WebRTC-видеоприем · Защищенное соединение</div>
      <button class="logout-button" id="leave">Выйти из приема</button>
    </header>
    <section class="room-title">
      <div>
        <div class="live-dot"><span></span>ВИДЕОПРИЕМ В ПРОЦЕССЕ</div>
        <h1>Елена Смирнова <small>и</small> Анна Крылова</h1>
        <p id="connectionText">Запрашиваем доступ к камере и микрофону…</p>
      </div>
      <div class="room-timer" id="roomTimer">00:00</div>
    </section>
    <section class="video-grid">
      <div class="main-video doctor-feed" id="remoteFeed">
        <video id="remoteVideo" class="media-video" autoplay playsinline></video>
        <div class="silhouette doctor-silhouette">АК</div>
        <div class="feed-label">
          <strong id="remoteName">Собеседник</strong>
          <small id="remoteRole">Удаленное видео</small>
        </div>
      </div>
      <div class="side-video patient-feed" id="localFeed">
        <video id="localVideo" class="media-video local-preview" autoplay playsinline muted></video>
        <div class="silhouette patient-silhouette">Я</div>
        <div class="feed-label">
          <strong id="localName">Вы</strong>
          <small id="localRole">Локальное видео</small>
        </div>
      </div>
    </section>
    <div class="room-controls">
      <button id="mic" class="control-button" type="button">♩<small>Микрофон</small></button>
      <button id="camera" class="control-button" type="button">▣<small>Камера</small></button>
      <button id="screen" class="control-button" type="button">↗<small>Экран</small></button>
      <button id="end" class="control-button end-call" type="button">☎<small>Завершить</small></button>
    </div>
    <div class="room-note">
      <span>◉</span>
      <strong>Медиапоток защищен WebRTC (DTLS-SRTP)</strong>
      <span id="participantState">Ожидание второго участника</span>
    </div>
  </main>
  <script src="video.js"></script>
</body>
</html>
